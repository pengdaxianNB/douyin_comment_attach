[project]
name = "douyin-comment-attach"
version = "0.1.0"
description = "熊猫领航 · 评论客户工作台"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7,<7",
    "playwright>=1.48,<2",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
